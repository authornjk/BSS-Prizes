@page { size: letter portrait; margin: 0.5in 0.25in; }
/* Clothing tags print landscape (11"×8.5") — overridden dynamically per
   selected tag type via #page-orientation-style, injected in buildSheets(). */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0f0}
.controls{background:#3C3489;color:white;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.controls h1{font-size:15px;font-weight:600;flex:1}
.ctrl-select{font-size:13px;padding:5px 9px;border-radius:6px;border:none;background:rgba(255,255,255,.2);color:white}
.ctrl-select option{color:#2C2C2C;background:white}
.btn-print{background:white;color:#3C3489;border:none;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer}
.loading{text-align:center;padding:40px;color:#666;font-size:14px}
.sheet{width:fit-content;margin:0 auto;background:white}
/* Visual-only representation of the physical 8.5"×11" sheet with the 8"×10"
   tag table centered inside it (0.25in side / 0.5in top-bottom margin) — so
   the printer allowance is actually visible on screen, not just baked into
   the invisible @page rule above which only applies once you print/export. */
.page-frame{width:8.5in;margin:28px auto;background:white;box-shadow:0 2px 14px rgba(0,0,0,.18);position:relative;padding:0.5in 0.25in;box-sizing:border-box}
.page-frame.landscape{width:11in;padding:0.25in 0.5in}
.page-frame-label{position:absolute;top:-20px;left:0;font-size:11px;color:#888;font-family:-apple-system,sans-serif}
.page-frame .sheet{outline:1px dashed #bbb}
@media print{
  .page-frame{width:auto;box-shadow:none;padding:0;margin:0}
  .page-frame-label{display:none}
  .page-frame .sheet{outline:none}
}

/* ── BOOK tag: 2"×5", 4 cols × 2 rows = 8in × 10in table (printer allowance built into @page margin above) ── */
.page-book{display:grid;grid-template-columns:repeat(4,2in);grid-template-rows:repeat(2,5in);gap:0;background:white;page-break-after:always}
.bm{width:2in;height:5in;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;background:white;border:.5px solid #ddd;font-family:Calibri,Carlito,sans-serif}
.bm-logo{width:1.7in;height:.4in;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.bm-logo img{max-width:100%;max-height:100%;object-fit:contain}
.bm-logo-ph{font-size:6.5px;color:#aaa;text-align:center;border:1px dashed #ddd;margin:4px;width:calc(100% - 8px);height:calc(100% - 8px);display:flex;align-items:center;justify-content:center;border-radius:3px}
.bm-headline{font-family:Calibri,Carlito,sans-serif;font-size:10.6pt;color:#1B2A4A;text-align:center;padding:0 6px;line-height:1.3;font-weight:500;flex-shrink:0}
.bm-donor{width:calc(100% - 10px);margin:0 5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;min-height:.4in}
.bm-donor img{max-width:100%;max-height:.6in;object-fit:contain}
.bm-donor-name{font-family:'Adobe Garamond Pro','EB Garamond',Garamond,serif;font-variant:small-caps;font-size:16pt;font-weight:600;color:#1B2A4A;text-align:center;line-height:1.75;padding:0 3px;width:100%}
.bm-body{font-family:Calibri,Carlito,sans-serif;font-size:10.6pt;color:#1B2A4A;text-align:center;padding:0 7px;line-height:1.3;flex-shrink:0}
.bm-heart{font-size:15px;text-align:center;flex-shrink:0}
.bm-qr{width:100%;padding:0 6px;display:flex;align-items:center;gap:5px;flex-shrink:0}
.bm-qr-img{width:.5in;height:.5in;flex-shrink:0}
.bm-qr-img img{width:100%;height:100%}
.bm-qr-ph{width:.5in;height:.5in;border:1px dashed #ccc;display:flex;align-items:center;justify-content:center;font-size:6px;color:#aaa;text-align:center;flex-shrink:0}
.bm-qr-right{flex:1}
.bm-qr-line{width:100%;height:.5px;background:#333;margin:2px 0}
.bm-qr-lbl{font-family:Calibri,Carlito,sans-serif;font-size:10.6pt;color:#333;text-align:center;line-height:1.25;padding:1px 0}

/* ── CLOTHING tag: 2.5"×4", printed landscape ──
   Uses your actual template PNG as the background — hole, logo, circle,
   headline, body text, both navy lines, and the heart are all baked into
   that image at their real, correct positions. Nothing here re-derives
   or redraws any of that, which removes the risk of me re-measuring it
   wrong. Only three things are ever overlaid on top, because only these
   three actually change per prize:
     size value        centered inside the circle,  top .96in, h .571in
     donor name/logo   centered in the blank zone,  top 1.84in, h .5in
     QR code + caption "Scan the QR code to / visit [pronoun] website"
                        QR: .45×.45in, left .39in, top 3.43in
                        caption: 1×.208in, right .39in, top 3.5in
*/
.page-clothing{display:grid;grid-template-columns:repeat(4,2.5in);grid-template-rows:repeat(2,4in);gap:0.02in;background:white;page-break-after:always}
.ct{width:2.5in;height:4in;overflow:hidden;background-color:white;background-image:var(--ct-template-url);background-size:100% 100%;background-repeat:no-repeat;border:.5px solid #ddd;position:relative;font-family:Calibri,Carlito,sans-serif}
.ct-size-value-wrap{position:absolute;left:0;right:0;top:.96in;height:.571in;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ct-size-value{font-family:'Adobe Garamond Pro','EB Garamond',Garamond,serif;font-variant:small-caps;font-size:20pt;color:#1B2A4A;line-height:1;white-space:nowrap;display:inline-block}
.ct-donor{position:absolute;left:6px;right:6px;top:1.84in;height:.5in;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ct-donor img{max-width:2in;max-height:min(.75in,100%);object-fit:contain}
.ct-donor-name{font-family:'Adobe Garamond Pro','EB Garamond',Garamond,serif;font-variant:small-caps;font-size:16pt;font-weight:600;color:#1B2A4A;text-align:center;line-height:1.4;width:100%;padding:0 4px}
.ct-qr-img{width:.45in;height:.45in;position:absolute;left:.39in;top:3.43in}
.ct-qr-img img{width:100%;height:100%}
.ct-qr-ph{width:.45in;height:.45in;border:1px dashed #ccc;display:flex;align-items:center;justify-content:center;font-size:5px;color:#aaa;position:absolute;left:.39in;top:3.43in}
.ct-qr-lbl{width:1in;height:.208in;overflow:hidden;font-family:Helvetica,Arial,sans-serif;font-size:6.5pt;color:#E2765E;text-align:center;line-height:1.05;position:absolute;right:.39in;top:3.5in}

/* ── ITEM tag: 2.5"×3", 4 cols × 2 rows ── */
.page-item{display:grid;grid-template-columns:repeat(4,2.5in);grid-template-rows:repeat(2,3in);gap:0.02in;background:white;page-break-after:always}
.it{width:2.5in;height:3in;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;background:white;border:.5px solid #ddd;position:relative;font-family:Calibri,Carlito,sans-serif}
.it-hole{width:.2in;height:.2in;border-radius:50%;border:1.5px solid #888;position:absolute;top:.12in;left:.12in}
.it-logo{width:1.7in;height:.4in;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.it-logo img{max-width:90%;max-height:90%;object-fit:contain}
.it-logo-ph{font-size:6px;color:#aaa;border:1px dashed #ddd;margin:3px;width:calc(100% - 6px);height:calc(100% - 6px);display:flex;align-items:center;justify-content:center;border-radius:3px}
.it-headline{font-family:Calibri,Carlito,sans-serif;font-size:10.6pt;color:#1B2A4A;text-align:center;padding:0 6px;line-height:1.3;font-weight:500;flex-shrink:0}
.it-donor{width:calc(100% - 10px);margin:0 5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;min-height:.4in}
.it-donor img{max-width:100%;max-height:.5in;object-fit:contain}
.it-donor-name{font-family:'Adobe Garamond Pro','EB Garamond',Garamond,serif;font-variant:small-caps;font-size:16pt;font-weight:600;color:#1B2A4A;text-align:center;line-height:1.75;width:100%;padding:0 3px}
.it-body{font-family:Calibri,Carlito,sans-serif;font-size:10.6pt;color:#1B2A4A;text-align:center;padding:0 7px;line-height:1.3;flex-shrink:0}
.it-heart{font-size:11px;text-align:center;flex-shrink:0}
.it-qr{width:100%;padding:0 5px;display:flex;align-items:center;gap:4px;flex-shrink:0}
.it-qr-img{width:.4in;height:.4in;flex-shrink:0}
.it-qr-img img{width:100%;height:100%}
.it-qr-ph{width:.4in;height:.4in;border:1px dashed #ccc;display:flex;align-items:center;justify-content:center;font-size:5px;color:#aaa;flex-shrink:0}
.it-qr-lbl{flex:1;font-family:Calibri,Carlito,sans-serif;font-size:10.6pt;color:#333;text-align:center;line-height:1.25}
.it-qr-line{width:100%;height:.5px;background:#333;margin:1px 0}

.empty-slot{border:1px dashed #eee;background:#fafafa}
@media print{.controls{display:none!important}body,html{background:white}.sheet{margin:0;width:100%}}
</style>
</head>
<body>
<div class="controls">
  <h1 id="ctrl-title">🔖 Donation Tags</h1>
  <select class="ctrl-select" id="type-sel" onchange="buildSheets()">
    <option value="book">Book tags (2"×5" bookmark)</option>
    <option value="clothing">Clothing tags (2.5"×4")</option>
    <option value="item">Item tags (2.5"×3")</option>
  </select>
  <select class="ctrl-select" id="status-sel" onchange="buildSheets()">
    <option value="unprinted">Not yet generated</option>
    <option value="all">All with donors</option>
    <option value="reprint">All — including already generated</option>
  </select>
  <button class="btn-print" onclick="doPrint()">🖨 Print / Save PDF</button>
</div>
<div id="loading" class="loading">Loading prizes from Firebase…</div>
<div id="sheet-wrap"></div>

<script>
const params=new URLSearchParams(window.location.search);
const DB=params.get('db')||localStorage.getItem('soiree_firebase_url')||'';
const TYPE=params.get('type')||'book';
const GDRIVE_FOLDER='1F4JcjLJhGbH14fUKv-dzrK1v85R8Qzqf';

// Pre-select type from URL param
document.getElementById('type-sel').value=TYPE;

const BODY_TEXT='Donations like this make it<br>possible for us to provide<br>everyone a gift. 🎁<br>Please, find a way to show<br>them some gratitude!<br>Send them a message,<br>make a social media post, or<br>next time you are gift<br>shopping for yourself, or a<br>friend, remember them.';

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function qr(url){return`https://chart.googleapis.com/chart?chs=150x150&cht=qr&chl=${encodeURIComponent(url||'https://example.com')}&choe=UTF-8`;}
function donorSection(p,nameClass,imgClass){
  if(p.donorLogo) return`<div class="${nameClass.replace('name','')}" style="width:calc(100% - 10px);margin:3px 5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;min-height:.5in"><img src="${esc(p.donorLogo)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="${nameClass}" style="display:none">${esc(p.donor)}</div></div>`;
  return`<div class="${nameClass}">${esc(p.donor)}</div>`;
}

let _allPrizes=[];

function filterPrizes(){
  const type=document.getElementById('type-sel').value;
  const status=document.getElementById('status-sel').value;
  return _allPrizes.filter(p=>{
    if(!p.donor||!p.needTag) return false;
    if(p.bundledInto) return false;
    // donationTagType ('book'/'clothing'/'other') is set per-donation, independent
    // of itemType — an author can donate clothing, a business can donate a book, etc.
    const tagType=p.donationTagType||'book';
    if(type==='book'&&tagType!=='book') return false;
    if(type==='clothing'&&tagType!=='clothing') return false;
    if(type==='item'&&tagType!=='other') return false;
    if(status==='unprinted') return !p.tagGenerated;
    return true;
  });
}

function bookTag(p){
  const pr=p.donorPronoun||'their';
  const qrDest=p.donorWebsite||p.url||'';
  const logoArea=p.donorLogo
    ?`<div class="bm-donor"><img src="${esc(p.donorLogo)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="bm-donor-name" style="display:none">${esc(p.donor)}</div></div>`
    :`<div class="bm-donor"><div class="bm-donor-name">${esc(p.donor)}</div></div>`;
  // No website on file → no QR to scan, so drop that section entirely and
  // let the heart become the final item; justify-content:space-evenly on
  // .bm then automatically re-spreads the remaining 5 sections evenly.
  const qrSection=qrDest?`<div class="bm-qr">
      <div class="bm-qr-img"><img src="${qr(qrDest)}" alt="QR"></div>
      <div class="bm-qr-right"><div class="bm-qr-line"></div><div class="bm-qr-lbl">Scan the QR<br>code to visit<br>${esc(pr)} website</div><div class="bm-qr-line"></div></div>
    </div>`:'';
  return`<div class="bm">
    <div class="bm-logo">${'<!-- LOGO_PLACEHOLDER -->'?`<img src="" id="bm-logo-img" style="max-width:100%;max-height:100%;object-fit:contain" alt="Bookish Summer Soirée 2027">`:''}</div>
    <div class="bm-headline">This book was<br>donated by</div>
    ${logoArea}
    <div class="bm-body">${BODY_TEXT}</div>
    <div class="bm-heart">🩷</div>
    ${qrSection}
  </div>`;
}

function clothingTag(p){
  const pr=p.donorPronoun||'their';
  const size=p.clothingSize==='Custom'?(p.clothingSizeCustom||''):p.clothingSize||'';
  const isOneSize = p.clothingSize==='One size';
  const qrDest=p.donorWebsite||'';
  const logoArea=p.donorLogo
    ?`<div class="ct-donor"><img src="${esc(p.donorLogo)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="ct-donor-name" style="display:none">${esc(p.donor)}</div></div>`
    :`<div class="ct-donor"><div class="ct-donor-name">${esc(p.donor)}</div></div>`;
  // Hole, logo, ring, headline, body, both navy lines, and the heart are
  // all baked into the template background image now — only the QR code
  // image and the caption text (which has the dynamic pronoun) are real
  // overlays. No website on file → nothing to scan, so it's omitted.
  const qrSection=qrDest?`
    <div class="ct-qr-img"><img src="${qr(qrDest)}" alt="QR"></div>
    <div class="ct-qr-lbl">Scan the QR code to<br>visit ${esc(pr)} website</div>`:'';
  const sizeSection = (isOneSize || !size) ? '' : `<div class="ct-size-value-wrap"><span class="ct-size-value">${esc(size)}</span></div>`;
  return`<div class="ct">
    ${sizeSection}
    ${logoArea}
    ${qrSection}
  </div>`;
}

function itemTag(p){
  const pr=p.donorPronoun||'their';
  const qrDest=p.donorWebsite||'';
  const logoArea=p.donorLogo
    ?`<div class="it-donor"><img src="${esc(p.donorLogo)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="it-donor-name" style="display:none">${esc(p.donor)}</div></div>`
    :`<div class="it-donor"><div class="it-donor-name">${esc(p.donor)}</div></div>`;
  const qrSection=qrDest?`<div class="it-qr">
      <div class="it-qr-img"><img src="${qr(qrDest)}" alt="QR"></div>
      <div class="it-qr-lbl"><div class="it-qr-line"></div>Scan the QR<br>code to visit<br>${esc(pr)} website<div class="it-qr-line"></div></div>
    </div>`:'';
  return`<div class="it">
    <div class="it-hole"></div>
    <div class="it-logo"><img src="" class="tag-logo-img" style="max-width:95%;max-height:95%;object-fit:contain" alt="Soirée 2027"></div>
    <div class="it-headline">This item was<br>donated by</div>
    ${logoArea}
    <div class="it-body">${BODY_TEXT}</div>
    <div class="it-heart">🩷</div>
    ${qrSection}
  </div>`;
}

function setPageOrientation(type){
  let styleEl = document.getElementById('page-orientation-style');
  if (!styleEl) {
    styleEl = document.createElement('style');
    styleEl.id = 'page-orientation-style';
    document.head.appendChild(styleEl);
  }
  // Clothing tag table is 10in wide x 8in tall (4×2.5in cols, 2×4in rows) —
  // fits a landscape 11"×8.5" sheet with 0.5in side / 0.25in top-bottom margin.
  styleEl.textContent = type==='clothing'
    ? '@page { size: letter landscape; margin: 0.25in 0.5in; }'
    : '@page { size: letter portrait; margin: 0.5in 0.25in; }';
}

function buildSheets(){
  const type=document.getElementById('type-sel').value;
  setPageOrientation(type);
  const filtered=filterPrizes();
  // One donated article can have qty > 1 (e.g. a donor gave 8 of the same
  // shirt) — expand each prize into `qty` individual tags rather than
  // printing just one tag per database record.
  const prizes=[];
  filtered.forEach(p=>{
    const n = Math.max(1, +p.qty||1);
    for(let i=0;i<n;i++) prizes.push(p);
  });
  const wrap=document.getElementById('sheet-wrap');
  document.getElementById('loading').style.display='none';
  if(!prizes.length){wrap.innerHTML=`<div class="loading">No matching prizes found for this tag type and filter.</div>`;return;}
  const PER=8;
  const pageClass=type==='book'?'page-book':type==='clothing'?'page-clothing':'page-item';
  const tagFn=type==='book'?bookTag:type==='clothing'?clothingTag:itemTag;
  const emptyClass=type==='book'?'bm':type==='clothing'?'ct':'it';
  let html='';
  for(let i=0;i<prizes.length;i+=PER){
    const batch=prizes.slice(i,i+PER);
    while(batch.length<PER) batch.push(null);
    const sheetHtml=`<div class="sheet"><div class="${pageClass}">${batch.map(p=>p?tagFn(p):`<div class="${emptyClass} empty-slot"></div>`).join('')}</div></div>`;
    html+=type==='book'
      ? `<div class="page-frame"><div class="page-frame-label">8.5" × 11" sheet — dashed line shows the 8" × 10" tag table (0.25in side / 0.5in top-bottom margin)</div>${sheetHtml}</div>`
      : type==='clothing'
      ? `<div class="page-frame landscape"><div class="page-frame-label">11" × 8.5" landscape sheet — dashed line shows the 10" × 8" tag table (0.5in side / 0.25in top-bottom margin)</div>${sheetHtml}</div>`
      : sheetHtml;
  }
  wrap.innerHTML=html;
  document.getElementById('ctrl-title').textContent=`🔖 ${prizes.length} ${type} tag${prizes.length!==1?'s':''}`;
  if(type==='clothing') fitSizeValues();
}

// Safety net for the size circle: at 20pt, most sizes (S, M, L, XL) fit
// fine, but a longer label (XXXL, or a custom size) could overflow the
// smaller .65in circle. Shrinks that specific label — and only that
// label — down in small steps until it fits, never touching anything else.
function fitSizeValues(){
  document.querySelectorAll('.ct-size-value').forEach(el=>{
    const wrap=el.parentElement;
    let size=20;
    el.style.fontSize=size+'pt';
    while(el.scrollWidth>wrap.clientWidth && size>10){
      size-=0.5;
      el.style.fontSize=size+'pt';
    }
  });
}

async function doPrint(){
  // Mark all currently displayed prizes as tagGenerated
  const prizes=filterPrizes();
  const ids=prizes.map(p=>p.id);
  if(DB&&ids.length){
    try{
      for(const id of ids){
        await fetch(`${DB}/prizes/${id}/tagGenerated.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:'true'});
        await fetch(`${DB}/prizes/${id}/tagMade.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:'true'});
      }
    }catch(e){console.warn('Could not mark tags as generated:',e);}
  }
  window.print();
}

async function loadPrizes(){
  if(!DB){document.getElementById('loading').innerHTML='<b>Firebase URL not set.</b> Open this page from the Prize Manager app.';return;}
  try{
    const res=await fetch(DB+'/prizes.json');
    const data=await res.json();
    _allPrizes=data?Object.values(data):[];
    buildSheets();
  }catch(e){document.getElementById('loading').innerHTML='Could not load prizes. Check your Firebase URL.';}
}

loadPrizes();

// Set logo once available
function applyLogo(){
  const src = window.SOIREE_LOGO_2027 || '';
  document.querySelectorAll('#bm-logo-img,.tag-logo-img').forEach(img=>{ img.src=src; });
}
// Re-apply after sheets are built
const _origBuildSheets = buildSheets;
buildSheets = function(){
  _origBuildSheets();
  setTimeout(applyLogo, 50);
};
// Apply on logo script load
window.addEventListener('load', applyLogo);

</script>
<script src="js/logo.js"></script>
</body>
</html>
